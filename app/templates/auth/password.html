{% extends "base.html" %}
{% block title %}Passwort ändern - BYCS-Kursdashboard{% endblock %}
{% block content %}
  <div class="card card-narrow">
    <h1>Passwort ändern</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="old_password">Aktuelles Passwort</label>
      <input type="password" id="old_password" name="old_password" autocomplete="current-password" required autofocus>
      <label for="new_password">Neues Passwort (mind. 8 Zeichen)</label>
      <input type="password" id="new_password" name="new_password" autocomplete="new-password" required>
      <label for="repeat_password">Neues Passwort wiederholen</label>
      <input type="password" id="repeat_password" name="repeat_password" autocomplete="new-password" required>
      <button type="submit">Speichern</button>
    </form>
    <p><a href="{{ url_for('dashboard.list_dashboards') }}">&larr; Zurück</a></p>
  </div>
{% endblock %}
