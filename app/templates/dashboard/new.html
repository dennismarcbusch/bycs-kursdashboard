{% extends "base.html" %}
{% block title %}Neue Klasse - BYCS-Kursdashboard{% endblock %}
{% block content %}
  <div class="card card-narrow">
    <h1>Neue Klasse anlegen</h1>
    <form method="post">
      <label for="name">Name der Klasse</label>
      <input type="text" id="name" name="name" required autofocus placeholder="z. B. ITS10">
      <button type="submit">Anlegen</button>
    </form>
  </div>
{% endblock %}
